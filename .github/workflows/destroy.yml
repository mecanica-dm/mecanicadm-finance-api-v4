name: DESTROY - Finance DB + Secrets (botão vermelho)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite DESTRUIR para confirmar"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Compartilhado com o terraform.yml: nunca apply e destroy ao mesmo tempo.
  group: terraform-finance-prod
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'mecanicadm-v4-01' }}
  TF_STATE_KEY: terraform/mecanicadm-finance/terraform.tfstate
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  ENVIRONMENT: prod
  SERVICE_NAME: finance

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60

    if: inputs.confirmation == 'DESTRUIR'

    defaults:
      run:
        working-directory: devops/terraform

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_DEFAULT_REGION}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false -no-color

      # A deleção mais demorada é a do RDS (vários minutos). Os secrets usam
      # recovery window 0, então somem na hora e não bloqueiam um novo apply.
      - name: Verifica órfãos (informativo)
        if: always()
        run: |
          echo "=== Instâncias RDS do finance restantes ==="
          aws rds describe-db-instances \
            --query "DBInstances[?DBInstanceIdentifier=='mecanicadm-${ENVIRONMENT}-${SERVICE_NAME}'].DBInstanceIdentifier" \
            --output table 2>/dev/null || true
          echo "=== Secrets do finance restantes ==="
          aws secretsmanager list-secrets \
            --query "SecretList[?contains(Name, '${SERVICE_NAME}')].Name" \
            --output table 2>/dev/null || true
          echo "=== Parâmetros SSM do finance restantes ==="
          aws ssm describe-parameters \
            --parameter-filters "Key=Name,Option=BeginsWith,Values=/mecanicadm/${ENVIRONMENT}/${SERVICE_NAME}" \
            --query 'Parameters[].Name' \
            --output table 2>/dev/null || true
          echo ">>> Se aparecer algo acima, apague manualmente pelo console."
