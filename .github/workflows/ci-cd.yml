name: CI/CD - API Mecânica DM.

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read
  # Necessario para disparar o app-deploy.yml via "gh workflow run" com o
  # GITHUB_TOKEN (workflow_dispatch exige actions: write).
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: ${{ vars.DOCKER_IMAGE_REPO }}
  IMAGE_TAG: prod-${{ github.sha }}
  CI_IMAGE: mecanicadm-finance-api-v4:ci

jobs:
  build-and-test:
    name: Build, Testes e Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn -B clean verify

      - name: Sonar Analysis
        if: github.event_name != 'schedule'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B sonar:sonar -Dsonar.projectKey=mecanica-dm_mecanicadm-finance-api-v4
          -Dsonar.organization=mecanica-dm
          -Dsonar.host.url=https://sonarcloud.io/

  security-scan:
    name: OWASP ZAP Scan
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=admin" >> .env
          echo "POSTGRES_PASSWORD=admin" >> .env
          echo "POSTGRES_DB=mecanicadmfinancedb" >> .env
          echo "SPRING_PROFILES_ACTIVE=ci" >> .env

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Application
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      # O "sleep 15" antigo nao era suficiente: o compose sobe Postgres e
      # RabbitMQ (healthchecks) e o Spring ainda roda Flyway + JPA. Enquanto a
      # API nao respondia, o ZAP falhava com "Connection refused" e
      # "Failed to import any URLs" (NoUrlsException).
      - name: Wait for application startup
        run: |
          set -euo pipefail

          base_url="http://localhost:8080"
          timeout=300
          elapsed=0

          until curl -fsS -o /dev/null "${base_url}/api/actuator/health/readiness"; do
            if [ "${elapsed}" -ge "${timeout}" ]; then
              echo "::error::A API nao ficou pronta em ${timeout}s"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=300
              exit 1
            fi
            echo "Aguardando a API... (${elapsed}s/${timeout}s)"
            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "API pronta em ${elapsed}s. Validando o OpenAPI..."
          spec_file="${RUNNER_TEMP}/openapi.json"
          curl -fsS "${base_url}/api/v3/api-docs" -o "${spec_file}"
          jq -e '(.paths // {}) | length > 0' "${spec_file}" > /dev/null
          echo "Endpoints encontrados: $(jq '(.paths // {}) | length' "${spec_file}")"

      - name: Give permissions for ZAP
        run: chmod -R 777 .

      - name: ZAP Scan para OpenAPI
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:8080/api/v3/api-docs'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false

      - name: Upload ZAP Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report_md.md
            report_json.json

      - name: Stop Containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans

  publish-and-deploy:
    name: Publicação da imagem e Deploy
    needs: [ build-and-test, security-scan ]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O deploy roda neste repositorio (devops/k8s + app-deploy.yml). O antigo
      # repository_dispatch para o mecanicadm-k8s-v3 foi removido: aquele repo
      # nao e mais usado. "gh workflow run" precisa do GITHUB_TOKEN (nao de PAT)
      # e da permissao actions: write declarada no topo do workflow.
      - name: Dispara o deploy no Kubernetes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run app-deploy.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f image_tag="$IMAGE_TAG"
