services:
  db:
    image: postgres:15-alpine
    container_name: mecanicadm-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: mecanicadm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mecanicadm-finance-api-v4
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-mecanicadmfinancedb}
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-development}
      - BUDGET_BASE_URL=${BUDGET_BASE_URL:-http://localhost:8080/api}
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN:-}
      - MERCADO_PAGO_PUBLIC_KEY=${MERCADO_PAGO_PUBLIC_KEY:-}
      - MERCADO_PAGO_CLIENT_ID=${MERCADO_PAGO_CLIENT_ID:-}
      - MERCADO_PAGO_CLIENT_SECRET=${MERCADO_PAGO_CLIENT_SECRET:-}
      - MERCADO_PAGO_DEFAULT_CARD_NUMBER=${MERCADO_PAGO_DEFAULT_CARD_NUMBER:-4235647728025682}
      - MERCADO_PAGO_DEFAULT_CARD_EXPIRATION_MONTH=${MERCADO_PAGO_DEFAULT_CARD_EXPIRATION_MONTH:-11}
      - MERCADO_PAGO_DEFAULT_CARD_EXPIRATION_YEAR=${MERCADO_PAGO_DEFAULT_CARD_EXPIRATION_YEAR:-2030}
      - MERCADO_PAGO_DEFAULT_CARD_SECURITY_CODE=${MERCADO_PAGO_DEFAULT_CARD_SECURITY_CODE:-123}
      - MERCADO_PAGO_DEFAULT_CARD_HOLDER_NAME=${MERCADO_PAGO_DEFAULT_CARD_HOLDER_NAME:-APRO}
      - MERCADO_PAGO_DEFAULT_CARD_IDENTIFICATION_TYPE=${MERCADO_PAGO_DEFAULT_CARD_IDENTIFICATION_TYPE:-CPF}
      - MERCADO_PAGO_DEFAULT_CARD_IDENTIFICATION_NUMBER=${MERCADO_PAGO_DEFAULT_CARD_IDENTIFICATION_NUMBER:-19119119100}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-username}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-password}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin}
      - RABBITMQ_EXCHANGE_OUTPUT=${RABBITMQ_EXCHANGE_OUTPUT:-finance-output}
      - RABBITMQ_EXCHANGE_DEAD_LETTER=${RABBITMQ_EXCHANGE_DEAD_LETTER:-finance-dlx}
      - RABBITMQ_QUEUE_BUDGET=${RABBITMQ_QUEUE_BUDGET:-budget}
      - RABBITMQ_QUEUE_BUDGET_DLQ=${RABBITMQ_QUEUE_BUDGET_DLQ:-budget.dlq}
      - RABBITMQ_HEADER_EVENT_TYPE=${RABBITMQ_HEADER_EVENT_TYPE:-event-type}
      - RABBITMQ_RETRY_MAX_ATTEMPTS=${RABBITMQ_RETRY_MAX_ATTEMPTS:-5}
      - RABBITMQ_RETRY_INITIAL_INTERVAL=${RABBITMQ_RETRY_INITIAL_INTERVAL:-1s}
      - RABBITMQ_RETRY_MULTIPLIER=${RABBITMQ_RETRY_MULTIPLIER:-2}
      - RABBITMQ_RETRY_MAX_INTERVAL=${RABBITMQ_RETRY_MAX_INTERVAL:-30s}
      - INBOX_ENABLED=${INBOX_ENABLED:-true}
      - INBOX_RETENTION_DAYS=${INBOX_RETENTION_DAYS:-30}
      - INBOX_CLEANUP_CRON=${INBOX_CLEANUP_CRON:-0 30 3 * * *}
      - OUTBOX_ENABLED=${OUTBOX_ENABLED:-true}
      - OUTBOX_INITIAL_DELAY_MS=${OUTBOX_INITIAL_DELAY_MS:-5000}
      - OUTBOX_POLL_INTERVAL_MS=${OUTBOX_POLL_INTERVAL_MS:-1000}
      - OUTBOX_BATCH_SIZE=${OUTBOX_BATCH_SIZE:-50}
      - OUTBOX_PROCESSING_TIMEOUT_SECONDS=${OUTBOX_PROCESSING_TIMEOUT_SECONDS:-60}
      - OUTBOX_RETENTION_DAYS=${OUTBOX_RETENTION_DAYS:-30}
      - OUTBOX_CLEANUP_CRON=${OUTBOX_CLEANUP_CRON:-0 0 3 * * *}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  seeder:
    image: postgres:15-alpine
    container_name: mecanicadm-seeder
    depends_on:
      - api
    volumes:
      - ./docker/database/init.sql:/seed/init.sql:ro
    command: >
      sh -c '
        until PGPASSWORD=${POSTGRES_PASSWORD} psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc "SELECT 1 FROM flyway_schema_history WHERE success = true AND script = '\''V02__create_budget_decision_tokens_table.sql'\''" | grep -q 1; do
          echo "Aguardando o Flyway concluir as migrations...";
          sleep 3;
        done;
      
        echo "Flyway concluído! Rodando o init.sql...";
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /seed/init.sql
      '

volumes:
  postgres_data:
  rabbitmq_data:
