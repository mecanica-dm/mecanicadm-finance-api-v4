services:
  db:
    image: postgres:15-alpine
    container_name: mecanicadm-finance-api-v4-db
    ports:
      - "${FINANCE_DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-mecanicadmfinancedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mecanicadmfinancedb}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: mecanicadm-finance-api-v4-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  rabbitmq:
    profiles: [ "broker" ]
    container_name: mecanicadm-finance-api-v4-rabbitmq
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${BROKER_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${BROKER_PASSWORD:-guest}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-init:
    profiles: [ "broker" ]
    container_name: mecanicadm-finance-api-v4-rabbitmq-init
    image: curlimages/curl:8.10.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./messaging/definitions.json:/definitions.json:ro
    entrypoint: [ "sh", "-c" ]
    command:
      - >
        curl -sf --retry 10 --retry-delay 3 --retry-connrefused
        -u "${BROKER_USER:-guest}:${BROKER_PASSWORD:-guest}"
        -H "content-type: application/json"
        -X POST http://rabbitmq:15672/api/definitions
        --data @/definitions.json
        && echo "Topologia do finance aplicada"
    restart: "no"

  api:
    build: .
    container_name: mecanicadm-finance-api-v4
    ports:
      - "${FINANCE_PORT:-8082}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-mecanicadmfinancedb}
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-development}
      - BUDGET_BASE_URL=${FINANCE_PUBLIC_URL:-http://localhost:8082/api}
      - BUDGET_EXPIRATION_ENABLED=${BUDGET_EXPIRATION_ENABLED:-true}
      - BUDGET_EXPIRATION_INTERVAL_MS=${BUDGET_EXPIRATION_INTERVAL_MS:-60000}
      - BUDGET_EXPIRATION_BATCH_SIZE=${BUDGET_EXPIRATION_BATCH_SIZE:-50}
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN:-}
      - MERCADO_PAGO_PUBLIC_KEY=${MERCADO_PAGO_PUBLIC_KEY:-}
      - MERCADO_PAGO_CLIENT_ID=${MERCADO_PAGO_CLIENT_ID:-}
      - MERCADO_PAGO_CLIENT_SECRET=${MERCADO_PAGO_CLIENT_SECRET:-}
      - MERCADO_PAGO_WEBHOOK_SECRET=${MERCADO_PAGO_WEBHOOK_SECRET:-}
      - PAYMENT_WEBHOOK_SIGNATURE_REQUIRED=${PAYMENT_WEBHOOK_SIGNATURE_REQUIRED:-true}
      - PAYMENT_VERIFICATION_ENABLED=${PAYMENT_VERIFICATION_ENABLED:-true}
      - PAYMENT_VERIFICATION_INTERVAL_MS=${PAYMENT_VERIFICATION_INTERVAL_MS:-60000}
      - PAYMENT_VERIFICATION_MIN_AGE_SECONDS=${PAYMENT_VERIFICATION_MIN_AGE_SECONDS:-60}
      - PAYMENT_VERIFICATION_BATCH_SIZE=${PAYMENT_VERIFICATION_BATCH_SIZE:-20}
      - MERCADO_PAGO_DEFAULT_CARD_NUMBER=${MERCADO_PAGO_DEFAULT_CARD_NUMBER:-4235647728025682}
      - MERCADO_PAGO_DEFAULT_CARD_EXPIRATION_MONTH=${MERCADO_PAGO_DEFAULT_CARD_EXPIRATION_MONTH:-11}
      - MERCADO_PAGO_DEFAULT_CARD_EXPIRATION_YEAR=${MERCADO_PAGO_DEFAULT_CARD_EXPIRATION_YEAR:-2030}
      - MERCADO_PAGO_DEFAULT_CARD_SECURITY_CODE=${MERCADO_PAGO_DEFAULT_CARD_SECURITY_CODE:-123}
      - MERCADO_PAGO_DEFAULT_CARD_HOLDER_NAME=${MERCADO_PAGO_DEFAULT_CARD_HOLDER_NAME:-APRO}
      - MERCADO_PAGO_DEFAULT_CARD_IDENTIFICATION_TYPE=${MERCADO_PAGO_DEFAULT_CARD_IDENTIFICATION_TYPE:-CPF}
      - MERCADO_PAGO_DEFAULT_CARD_IDENTIFICATION_NUMBER=${MERCADO_PAGO_DEFAULT_CARD_IDENTIFICATION_NUMBER:-19119119100}
      - MAIL_HOST=${SMTP_HOST:-mailpit}
      - MAIL_PORT=${SMTP_PORT:-1025}
      - MAIL_USERNAME=${SMTP_USERNAME:-username}
      - MAIL_PASSWORD=${SMTP_PASSWORD:-password}
      - MAIL_SMTP_AUTH=${SMTP_AUTH:-false}
      - MAIL_SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - RABBITMQ_HOST=${BROKER_HOST:-host.docker.internal}
      - RABBITMQ_PORT=${BROKER_PORT:-5672}
      - RABBITMQ_USER=${BROKER_USER:-guest}
      - RABBITMQ_PASSWORD=${BROKER_PASSWORD:-guest}
      - RABBITMQ_EXCHANGE_OUTPUT=${RABBITMQ_EXCHANGE_OUTPUT:-finance-output}
      - RABBITMQ_EXCHANGE_INPUT=${RABBITMQ_EXCHANGE_INPUT:-finance-input}
      - RABBITMQ_EXCHANGE_DEAD_LETTER=${RABBITMQ_EXCHANGE_DEAD_LETTER:-finance-dlx}
      - RABBITMQ_QUEUE_BUDGET=${RABBITMQ_QUEUE_BUDGET:-budget}
      - RABBITMQ_QUEUE_BUDGET_DLQ=${RABBITMQ_QUEUE_BUDGET_DLQ:-budget.dlq}
      - RABBITMQ_QUEUE_PAYMENT=${RABBITMQ_QUEUE_PAYMENT:-payment}
      - RABBITMQ_QUEUE_PAYMENT_DLQ=${RABBITMQ_QUEUE_PAYMENT_DLQ:-payment.dlq}
      - RABBITMQ_HEADER_EVENT_TYPE=${RABBITMQ_HEADER_EVENT_TYPE:-event-type}
      - RABBITMQ_HEADER_MESSAGE_ID=${RABBITMQ_HEADER_MESSAGE_ID:-message-id}
      - RABBITMQ_RETRY_MAX_ATTEMPTS=${RABBITMQ_RETRY_MAX_ATTEMPTS:-5}
      - RABBITMQ_RETRY_INITIAL_INTERVAL=${RABBITMQ_RETRY_INITIAL_INTERVAL:-1s}
      - RABBITMQ_RETRY_MULTIPLIER=${RABBITMQ_RETRY_MULTIPLIER:-2}
      - RABBITMQ_RETRY_MAX_INTERVAL=${RABBITMQ_RETRY_MAX_INTERVAL:-30s}
      - INBOX_ENABLED=${INBOX_ENABLED:-true}
      - INBOX_RETENTION_DAYS=${INBOX_RETENTION_DAYS:-30}
      - INBOX_CLEANUP_CRON=${INBOX_CLEANUP_CRON:-0 30 3 * * *}
      - OUTBOX_ENABLED=${OUTBOX_ENABLED:-true}
      - OUTBOX_INITIAL_DELAY_MS=${OUTBOX_INITIAL_DELAY_MS:-5000}
      - OUTBOX_POLL_INTERVAL_MS=${OUTBOX_POLL_INTERVAL_MS:-1000}
      - OUTBOX_BATCH_SIZE=${OUTBOX_BATCH_SIZE:-50}
      - OUTBOX_PROCESSING_TIMEOUT_SECONDS=${OUTBOX_PROCESSING_TIMEOUT_SECONDS:-60}
      - OUTBOX_RETENTION_DAYS=${OUTBOX_RETENTION_DAYS:-30}
      - OUTBOX_CLEANUP_CRON=${OUTBOX_CLEANUP_CRON:-0 0 3 * * *}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health/liveness | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  seeder:
    image: postgres:15-alpine
    container_name: mecanicadm-finance-api-v4-seeder
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./docker/database/init.sql:/seed/init.sql:ro
    command: >
      sh -c '
        until PGPASSWORD=${POSTGRES_PASSWORD:-admin} psql -h db -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mecanicadmfinancedb} -tAc "SELECT 1 FROM flyway_schema_history WHERE success = true AND script = '\''V07__budget_decision_tokens_expiry_notified.sql'\''" | grep -q 1; do
          echo "Aguardando o Flyway concluir as migrations...";
          sleep 3;
        done;

        echo "Flyway concluido! Rodando o init.sql...";
        PGPASSWORD=${POSTGRES_PASSWORD:-admin} psql -h db -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mecanicadmfinancedb} -f /seed/init.sql
      '
    restart: "no"

volumes:
  postgres_data:
