# Configuracao nao sensivel da Finance API.
#
# Credenciais (banco, JWT, SMTP, New Relic, Mercado Pago e RabbitMQ) NAO ficam
# aqui: sao criadas pela pipeline (app-deploy.yml) nos Secrets
# "mecanicadm-finance-db-secrets" e "mecanicadm-finance-secrets".
apiVersion: v1
kind: ConfigMap
metadata:
  name: mecanicadm-finance-config
  namespace: mecanicadm
  labels:
    app.kubernetes.io/name: mecanicadm-finance
    app.kubernetes.io/instance: mecanicadm-finance
    app.kubernetes.io/part-of: mecanicadm
    app.kubernetes.io/component: finance-api
data:
  # Link enviado por e-mail no orcamento. O context-path da aplicacao e /api,
  # por isso a base ja termina em /api (o path /budget-decision/ e relativo).
  BUDGET_BASE_URL: "https://finance.mecanicadm.com.br/api"

  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS: "true"

  # O grupo de readiness do Spring Boot inclui, por padrao, apenas o estado do
  # pod. Declaramos "db" explicitamente para o pod nao ficar pronto com o banco
  # fora do ar, e deixamos o RabbitMQ de fora: um blip do broker nao deve tirar
  # o pod do Service.
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"

  # Broker gerenciado no CloudAMQP (Little Lemur). Host e porta nao sao segredo;
  # as credenciais (RABBITMQ_USER, RABBITMQ_PASSWORD e RABBITMQ_VHOST) chegam
  # pelo Secret "mecanicadm-finance-secrets", criado pela pipeline a partir do
  # SSM em /mecanicadm/prod/rabbitmq.
  RABBITMQ_HOST: "moose.rmq.cloudamqp.com"
  RABBITMQ_PORT: "5671"
  RABBITMQ_SSL_ENABLED: "true"
