# Exemplo das credenciais da Finance API.
#
# NAO aplique este arquivo: a pipeline (app-deploy.yml) cria os Secrets lendo o
# SSM e os GitHub Secrets. Use apenas como referencia para depuracao local ou
# para recriar um Secret manualmente.
#
# Secret do banco, lido de:
#   /mecanicadm/prod/finance/db_host
#   /mecanicadm/prod/finance/db_port
#   /mecanicadm/prod/finance/db_name
#   /mecanicadm/prod/finance/db_user
#   /mecanicadm/prod/finance/db_password
apiVersion: v1
kind: Secret
metadata:
  name: mecanicadm-finance-db-secrets
  namespace: mecanicadm
  labels:
    app.kubernetes.io/name: mecanicadm-finance
    app.kubernetes.io/instance: mecanicadm-finance
    app.kubernetes.io/part-of: mecanicadm
    app.kubernetes.io/component: finance-api
type: Opaque
stringData:
  DB_HOST: "<rds-endpoint>"
  DB_PORT: "5432"
  DB_NAME: "mecanicadmfinancedb"
  DB_USER: "finance_admin"
  DB_PASSWORD: "<senha-do-rds>"
---
# Secret da aplicacao:
#   JWT_SECRET                  -> /mecanicadm/prod/jwt_secret (criado pelo workorder)
#   MAIL_USERNAME / MAIL_PASSWORD / NEW_RELIC_LICENSE_KEY
#   MERCADO_PAGO_*              -> GitHub Secrets do repositorio
apiVersion: v1
kind: Secret
metadata:
  name: mecanicadm-finance-secrets
  namespace: mecanicadm
  labels:
    app.kubernetes.io/name: mecanicadm-finance
    app.kubernetes.io/instance: mecanicadm-finance
    app.kubernetes.io/part-of: mecanicadm
    app.kubernetes.io/component: finance-api
type: Opaque
stringData:
  JWT_SECRET: "<jwt-compartilhado>"
  MAIL_USERNAME: "<gmail>"
  MAIL_PASSWORD: "<app-password-do-gmail>"
  NEW_RELIC_LICENSE_KEY: "<license-key>"
  MERCADO_PAGO_ACCESS_TOKEN: "<access-token>"
  MERCADO_PAGO_PUBLIC_KEY: "<public-key>"
  MERCADO_PAGO_CLIENT_ID: "<client-id>"
  MERCADO_PAGO_CLIENT_SECRET: "<client-secret>"
