services:
  # A aplicacao NAO declara a topologia do RabbitMQ em runtime (ver
  # messaging/README.md): ela espera que as filas/exchanges de
  # messaging/definitions.json ja existam. No CI o broker sobe vazio, entao os
  # @RabbitListener fazem queue.declare passivo, recebem
  # "not_found: no queue 'payment' in vhost '/'" e, como
  # missingQueuesFatal=true por padrao, o contexto Spring nao sobe.
  #
  # Este servico importa as definicoes e a API so inicia depois que ele termina
  # com sucesso (service_completed_successfully).
  rabbitmq:
    profiles: !reset []
    ports: !reset []
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq-init:
    profiles: !reset []
    image: curlimages/curl:8.10.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./messaging/definitions.json:/definitions.json:ro
    entrypoint: [ "sh", "-c" ]
    command:
      - >
        curl -sf --retry 10 --retry-delay 3 --retry-connrefused
        -u "guest:guest"
        -H "content-type: application/json"
        -X POST http://rabbitmq:15672/api/definitions
        --data @/definitions.json
    restart: "no"

  api:
    image: mecanicadm-finance-api-v4:ci
    pull_policy: never
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
